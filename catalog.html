<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<header class="bar-atas">
    <div class="bar-brand">TokoKu</div>
    <div class="bar-user">
        <!-- Tombol Keranjang -->
        <button id="cartBtn" class="cart-btn">🛒 Keranjang (<span id="cartCount">0</span>)</button>


        <div id="userIconBtn" class="user-icon-btn" title="Menu Akun">
            👤            
        </div>

        
    </div>
</header>

    <!-- Konten Utama -->
    <main class="main-container">
        <!-- Filter & Search Section -->
        <section class="controls-section">
            <input type="text" id="searchInput" placeholder="Cari produk berdasarkan nama...">
            <select id="categorySelect">
                <option value="">Semua Kategori</option>
            </select>
            <select id="sortSelect">
                <option value="">Urutkan Harga</option>
                <option value="asc">Termurah ke Termahal</option>
                <option value="desc">Termahal ke Termurah</option>
            </select>
        </section>

        <!-- Global Error Message -->
        <div id="globalError" class="error-message hidden"></div>

        <!-- Product Grid -->
        <div id="productGrid" class="product-grid"></div>

        <!-- Load More / Pagination -->
        <div class="pagination-section">
            <button id="loadMoreBtn" class="load-more-btn">Muat Lebih Banyak</button>
        </div>
    </main>

    <!-- Modal Detail Produk -->
    <div id="productModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Modal Keranjang -->
    <div id="cartModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeCartModal" class="close-btn">&times;</span>
            <h2>Keranjang Belanja</h2>
            <div id="cartItemsList"></div>
            <div id="cartTotal" class="cart-total"></div>
        </div>
    </div>

    <div id="userMenuModal" class="modal hidden">
        <div class="modal-content user-menu-box">
            <span id="closeUserMenuModal" class="close-btn">&times;</span>
            <h3>Menu Akun</h3>
            <div class="user-menu-options">
                <button id="btnKeranjangKu" class="menu-option-btn">🛒 Keranjang-ku</button>
                <button id="btnLogoutModal" class="menu-option-btn logout-option-btn">🚪 Logout</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
