<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum modul 2- Login</title>

  <link rel="stylesheet" href="style.css">
  <script src="Page1Login.js" defer></script>
</head>
<body class="login-page">

  <main class="login-container">
    <section class="login-card">

      <h1>Masuk ke akunmu</h1>
      <p class="subtitle">
        Gunakan username &amp; password akunmu.
      </p>

      <form id="loginForm">

        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          required
        >

        <button id="loginButton" type="submit">
          Masuk
        </button>

        <p id="loadingMessage" class="status loading" hidden>
          Memverifikasi akun...
        </p>

        <p id="errorMessage" class="status error" hidden></p>

      </form>

    </section>
  </main>
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: white;
}

.login-container {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding-top: 75px;
}

.login-card {
  width: 304px;
  margin: auto;
}

.login-card h1 {
  margin-bottom: 12px;

  font-family: Georgia, serif;
  font-size: 25px;

  color: #253b5b;
}

.subtitle {
  margin-top: 0;
  margin-bottom: 32px;

  font-size: 13px;
  color: #718096;
}

label {
  display: block;

  margin-bottom: 7px;

  font-size: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  height: 38px;

  margin-bottom: 18px;
  padding: 0 10px;

  border: 1px solid #dccfbf;
  border-radius: 5px;

  background-color: #fffdfa;
}

input:focus {
  outline: none;
  border-color: #efa634;
}

button {
  width: 100%;
  height: 38px;

  border: none;
  border-radius: 5px;

  background-color: #efa634;

  color: #172033;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  background-color: #e49a25;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.loading {
  margin-top: 12px;

  font-size: 12px;
  color: #718096;
}

.error {
  margin-top: 12px;

  font-size: 12px;
  color: #c0392b;
}
</style>
</body>
</html>
